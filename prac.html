<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wisha Khalid — Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b1a;
      color: #fff;
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
    }

    /* ---------- HERO SECTION ---------- */
    .hero {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      text-align: center;
      position: relative;
    }

    /* WK Circle */
    .wk-circle {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: white;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      z-index: 2;
      overflow: hidden;
    }

    /* Glowing rotating border around WK (halo) */
    .wk-halo {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: conic-gradient(#007bff, #8a2be2, #007bff);
      animation: rotateHalo 6s linear infinite;
      filter: blur(3px) brightness(1.6);
      z-index: 1;
    }

    @keyframes rotateHalo {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* "See Work" Button */
    .see-work-btn {
      margin-top: 50px;
      padding: 12px 40px;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 500;
      color: white;
      background: linear-gradient(90deg, #007bff, #8a2be2);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 3;
    }

    .see-work-btn::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    .see-work-btn:hover::before {
      width: 300%;
      height: 300%;
    }

    .see-work-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.7);
    }

    /* ---------- PORTFOLIO SECTION ---------- */
    .portfolio {
      padding: 80px 0;
      text-align: center;
    }

    .portfolio h2 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      color: #fff;
    }

    .filter-buttons {
      margin-bottom: 40px;
    }

    .filter-buttons button {
      background: transparent;
      border: 1px solid #8a2be2;
      color: #fff;
      margin: 0 10px;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-buttons button:hover {
      background: #8a2be2;
    }

    .portfolio-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .portfolio-item {
      width: 280px;
      border: 2px solid #8a2be2;
      border-radius: 15px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .portfolio-item img {
      width: 100%;
      display: block;
    }

    .portfolio-item:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
    }

    /* ---------- CONTACT SECTION ---------- */
    .contact {
      padding: 80px 0;
      text-align: center;
    }

    .contact h2 {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    .contact form {
      max-width: 500px;
      margin: 0 auto;
    }

    .contact input,
    .contact textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
    }

    .contact button {
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(90deg, #007bff, #8a2be2);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .contact button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.7);
    }

    /* ---------- FOOTER ---------- */
    footer {
      background: #090915;
      padding: 15px 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <!-- HERO SECTION -->
  <section class="hero">
    <div class="wk-halo"></div>
    <div class="wk-circle"><span>WK</span></div>
    <button class="see-work-btn">See Work</button>
  </section>

  <!-- PORTFOLIO SECTION -->
  <section class="portfolio" id="portfolio">
    <h2>My Portfolio</h2>
    <div class="filter-buttons">
      <button data-filter="all">All</button>
      <button data-filter="web">Web</button>
      <button data-filter="design">Design</button>
      <button data-filter="app">App</button>
    </div>

    <div class="portfolio-gallery">
      <div class="portfolio-item" data-category="web">
        <img src="https://via.placeholder.com/300x200" alt="Project 1" />
      </div>
      <div class="portfolio-item" data-category="design">
        <img src="https://via.placeholder.com/300x200" alt="Project 2" />
      </div>
      <div class="portfolio-item" data-category="app">
        <img src="https://via.placeholder.com/300x200" alt="Project 3" />
      </div>
      <div class="portfolio-item" data-category="web">
        <img src="https://via.placeholder.com/300x200" alt="Project 4" />
      </div>
    </div>
  </section>

  <!-- CONTACT SECTION -->
  <section class="contact" id="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea rows="5" placeholder="Your Message"></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer>© 2025 Wisha Khalid. All rights reserved.</footer>

  <!-- FILTER SCRIPT -->
  <script>
    const buttons = document.querySelectorAll("[data-filter]");
    const items = document.querySelectorAll(".portfolio-item");

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const filter = button.getAttribute("data-filter");

        items.forEach((item) => {
          item.style.display =
            filter === "all" || item.dataset.category === filter
              ? "block"
              : "none";
        });
      });
    });
  </script>
</body>
</html>
